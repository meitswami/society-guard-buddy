name: Android app (Flutter)

# Builds the Flutter app in mobile/ — analyze, tests, signed APK + Play Store bundle (AAB).
# Optional: upload to the Play Console internal-testing track (manual run with publish=true).
#
# Secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of the upload keystore (.jks)       — release signing
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   GOOGLE_SERVICES_JSON      base64 of android/app/google-services.json — Firebase OTP + push
#   APP_ENV                   optional full contents of mobile/.env (defaults to .env.example)
#   PLAY_SERVICE_ACCOUNT_JSON optional Play Console service account JSON  — publishing
# Variables:
#   ANDROID_APPLICATION_ID    Play package name (must match the existing AppMySite listing)
#   ANDROID_VERSION_CODE_BASE number added to the run number; must exceed the live app's versionCode

on:
  push:
    branches: [main, main-c9n144]
    paths: ['mobile/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Upload the AAB to the Play Console internal track'
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      ANDROID_APPLICATION_ID: ${{ vars.ANDROID_APPLICATION_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: App config (.env)
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
        run: |
          if [ -n "$APP_ENV" ]; then printf '%s\n' "$APP_ENV" > .env; else cp .env.example .env; fi

      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
            echo "google-services.json written"
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret not set — build has no native Firebase (phone OTP/push)."
          fi

      - name: Release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
            {
              echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
              echo "storePassword=$STORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
            echo "Release keystore configured"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set — APK/AAB are signed with debug keys (not uploadable to Play)."
          fi

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Tests
        run: flutter test

      - name: Version
        id: version
        run: |
          BASE="${{ vars.ANDROID_VERSION_CODE_BASE }}"
          BASE="${BASE:-100}"
          echo "code=$(( BASE + GITHUB_RUN_NUMBER ))" >> "$GITHUB_OUTPUT"
          echo "name=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: flutter build apk --release --build-number=${{ steps.version.outputs.code }} --build-name=${{ steps.version.outputs.name }}

      - name: Build App Bundle
        run: flutter build appbundle --release --build-number=${{ steps.version.outputs.code }} --build-name=${{ steps.version.outputs.name }}

      - uses: actions/upload-artifact@v4
        with:
          name: kutumbika-android-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload to Play (internal track)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ vars.ANDROID_APPLICATION_ID }}
          releaseFiles: mobile/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
