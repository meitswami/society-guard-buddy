name: kutumbika_mobile
description: Kutumbika — native Android & iOS app (Flutter). Web stays on React/Vite.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.9.0
  flutter_riverpod: ^2.6.1
  google_fonts: ^6.2.1
  intl: ^0.20.2
  flutter_dotenv: ^5.2.1
  shared_preferences: ^2.5.3
  cached_network_image: ^3.4.1
  go_router: ^14.8.1
  image_picker: ^1.1.2
  geolocator: ^13.0.4
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.4
  record: ^5.2.0
  path_provider: ^2.1.5
  uuid: ^4.5.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env
