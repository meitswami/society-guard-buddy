# Container alternative (behind an existing reverse proxy / Traefik / Caddy on the VPS).
#   docker compose -f deploy/vps/docker-compose.yml up -d --build
# Values come from deploy/vps/.env (copy of the Vercel environment variables).
services:
  kutumbika-web:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID:-}
        VITE_FIREBASE_VAPID_KEY: ${VITE_FIREBASE_VAPID_KEY:-}
        VITE_RECAPTCHA_ENTERPRISE_SITE_KEY: ${VITE_RECAPTCHA_ENTERPRISE_SITE_KEY:-}
        VITE_RECAPTCHA_ASSESSMENT_STRICT: ${VITE_RECAPTCHA_ASSESSMENT_STRICT:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
