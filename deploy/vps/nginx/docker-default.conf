# Kutumbika web app (React/Vite SPA) on the Brandzaha VPS.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Releases are uploaded to /var/www/kutumbika/releases/<id>; `current` points at the live one.
    root /usr/share/nginx/html;
    index index.html;

    # Compression (static text assets; .wasm is large and compresses well).
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json application/wasm;


    # Security headers (camera/mic are needed by the AI kiosk on this origin only).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;

    # Hashed build assets never change → cache for a year.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # MediaPipe face detection (AI kiosk): wasm runtime + model with explicit MIME types.
    # (An empty `types {}` scoped to the location keeps the global mime.types for everything else.)
    location ~* \.wasm$ {
        types { }
        default_type application/wasm;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location ~* \.tflite$ {
        types { }
        default_type application/octet-stream;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    location /models/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # Service worker, manifest and the HTML shell must always be revalidated so updates show at once.
    location = /firebase-messaging-sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }
    location = /manifest.json {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;
    }

    # Single-page app: every unknown path (e.g. /privacy, /society-signup/status) serves index.html
    # — same as the Vercel rewrite in vercel.json.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Uploads come straight from Supabase, so the app itself needs no large bodies.
    client_max_body_size 2m;

    access_log /dev/stdout;
    error_log /dev/stderr warn;
}
