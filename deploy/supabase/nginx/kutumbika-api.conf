# Self-hosted Supabase API for Kutumbika (Kong gateway on 127.0.0.1:8100).
# DNS: A record api.kutumbika.meitcybersolutions.com -> VPS IP. Certificate: certbot --nginx.
server {
    listen 80;
    listen [::]:80;
    server_name api.kutumbika.meitcybersolutions.com;

    client_max_body_size 60m;   # storage uploads (photos, PDFs, voice notes)

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        # Realtime (websockets)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
